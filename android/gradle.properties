# The Flutter template asks for 8G of heap plus 4G of metaspace, which is more
# than this machine has in total — the build then swaps instead of working and
# looks like a deadlock. Sized to fit real memory instead.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=192m -XX:+HeapDumpOnOutOfMemoryError
# Fewer parallel workers, for the same reason: each one costs memory this
# machine does not have to spare.
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Dependency downloads here stall open at zero bytes rather than failing, which
# hangs the build indefinitely. Time them out so Gradle retries instead.
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=60000
